openapi: 3.1.0
info:
  title: ChangeFlow API
  version: 1.0.0
  description: >-
    API contract for the initial ChangeFlow request workflow. Better Auth provides
    account registration, sign-in, sign-out, and session validation under /api/auth.
    Public signup creates Requester permission only; Reviewer permission is
    provisioned through trusted server-side setup.
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: Authentication
  - name: Change Requests
paths:
  /api/auth/sign-up/email:
    post:
      tags: [Authentication]
      summary: Create an account with Requester permission
      description: The client cannot choose or submit role membership.
      operationId: signUpEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 1 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
      responses:
        '200':
          description: Account created and session established; Set-Cookie is returned.
        '400':
          description: Invalid input or account could not be created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: An account with this email already exists.
  /api/auth/sign-in/email:
    post:
      tags: [Authentication]
      summary: Sign in with email and password
      operationId: signInEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, writeOnly: true }
      responses:
        '200':
          description: Session established; Set-Cookie is returned.
        '401':
          description: Credentials are invalid.
  /api/auth/sign-out:
    post:
      tags: [Authentication]
      summary: End the current session
      operationId: signOut
      security:
        - sessionCookie: []
      responses:
        '200': { description: Session ended and cookie cleared. }
        '401': { description: No valid session exists. }

  /api/requests:
    get:
      tags: [Change Requests]
      summary: List requests visible to the current user
      description: >-
        Returns the union of the caller's own requests and requests in
        PendingReview when the caller currently has Reviewer permission.
      operationId: listRequests
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Visible requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChangeRequest' }
        '401': { description: A valid session is required. }
    post:
      tags: [Change Requests]
      summary: Create a draft request
      operationId: createRequest
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, reason]
              properties:
                title: { type: string, minLength: 1 }
                description: { type: string, minLength: 1 }
                reason: { type: string, minLength: 1 }
      responses:
        '201':
          description: Draft created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '400':
          description: Required text is missing or blank.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { description: A valid session is required. }

  /api/requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Change Requests]
      summary: Read a visible request
      operationId: getRequest
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Request details and review history visible to the caller.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '401': { description: A valid session is required. }
        '404': { description: Request does not exist or is not visible to the caller. }
    put:
      tags: [Change Requests]
      summary: Edit a request owned by the caller
      description: Only Draft and ChangesRequested requests can be edited.
      operationId: updateRequest
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, reason]
              properties:
                title: { type: string, minLength: 1 }
                description: { type: string, minLength: 1 }
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: Request updated; state is unchanged and version advanced.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '400':
          description: Required text is missing or blank.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { description: A valid session is required. }
        '404': { description: Request does not exist or is not visible to the caller. }
        '409': { description: Current request state does not allow editing. }
        '412': { description: If-Match does not match the current version. }
        '428': { description: If-Match is required. }

  /api/requests/{requestId}/submit:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Change Requests]
      summary: Submit a draft or resubmit a returned request
      operationId: submitRequest
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Request is now PendingReview.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '401': { description: A valid session is required. }
        '404': { description: Request does not exist or is not visible to the caller. }
        '409': { description: Current request state does not allow submission. }
        '412': { description: If-Match does not match the current version. }
        '428': { description: If-Match is required. }

  /api/requests/{requestId}/approve:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Change Requests]
      summary: Approve a pending request
      operationId: approveRequest
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Request is approved and immutable.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '401': { description: A valid session is required. }
        '403': { description: Request is visible to caller, but caller is the requester or lacks Reviewer permission. }
        '404': { description: Request does not exist or is not visible to the caller. }
        '409': { description: Request is not PendingReview. }
        '412': { description: If-Match does not match the current version. }
        '428': { description: If-Match is required. }

  /api/requests/{requestId}/request-changes:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Change Requests]
      summary: Return a pending request for changes
      description: A reason may be included; it is optional.
      operationId: requestChanges
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: [string, 'null'] }
      responses:
        '200':
          description: Request is now ChangesRequested; any supplied reason is recorded.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '401': { description: A valid session is required. }
        '403': { description: Request is visible to caller, but caller is the requester or lacks Reviewer permission. }
        '404': { description: Request does not exist or is not visible to the caller. }
        '409': { description: Request is not PendingReview. }
        '412': { description: If-Match does not match the current version. }
        '428': { description: If-Match is required. }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Opaque Better Auth database-backed session cookie returned by sign-in.
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag returned by the latest read or successful mutation.
      schema: { type: string }
  headers:
    ETag:
      description: Current opaque version token, including HTTP entity-tag quotes.
      schema: { type: string, example: '"8f9d858c-0869-4b25-9759-7621aa61168f"' }
  schemas:
    ChangeRequest:
      type: object
      required: [id, title, description, reason, requesterId, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        reason: { type: string }
        requesterId: { type: string }
        status:
          type: string
          enum: [Draft, PendingReview, Approved, ChangesRequested]
        version: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        reviewHistory:
          type: array
          items: { $ref: '#/components/schemas/ReviewDecision' }
    ReviewDecision:
      type: object
      required: [decision, reviewerId, decidedAt]
      properties:
        decision:
          type: string
          enum: [Approved, ChangesRequested]
        reviewerId: { type: string }
        reason: { type: [string, 'null'] }
        decidedAt: { type: string, format: date-time }
    Problem:
      type: object
      description: Problem Details response without sensitive implementation data.
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
